<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 150" role="img" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
<title>motionforge, zero-dep pure-CSS motion with 135 presets</title>
<desc>Chalkboard project card with lightning-bolt doodle, JavaScript language dot, and hand-drawn arrow.</desc>
<style>
