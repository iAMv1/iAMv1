<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 150" role="img" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
<title>mindpulse, stress detection from typing and mouse</title>
<desc>Chalkboard project card with pulse-line doodle, Python language dot, and hand-drawn arrow.</desc>
<style>
@media (prefers-color-scheme: light){
.bg{fill:#f8f6ee}
.panel{fill:#ffffff}
.s{stroke:#2d3142}
.tchalk{fill:#2d3142}
.tdim{fill:#9aa2b1}
.ay{stroke:#b45309}
.ac{stroke:#0369a1}
.ap{stroke:#be5a8b}
.apf{fill:#be5a8b}
.apr{stroke:#b91c1c}
.aprf{fill:#b91c1c}
}
.st-r{stroke:#e26d5c}.tx-r{fill:#e26d5c}@media (prefers-color-scheme: light){.st-r{stroke:#b91c1c}.tx-r{fill:#b91c1c}}</style>
<defs>
<filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="21" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
</filter>
</defs>
<rect class="bg" x="0" y="0" width="410" height="150" rx="14" fill="#111318"/>
<g id="rules"><line x1="24" y1="42" x2="386" y2="42" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/><line x1="24" y1="69" x2="386" y2="69" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/><line x1="24" y1="96" x2="386" y2="96" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/><line x1="24" y1="123" x2="386" y2="123" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/></g>
<rect class="panel ac" x="8" y="8" width="394" height="134" fill="#171a21" stroke="#7dd3fc" stroke-width="2.5" filter="url(#wob)" transform="rotate(-0.6 205 75)"/>
<g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
<path d="M8,34 H402"/>
<path d="M8,64 H402"/>
<path d="M8,94 H402"/>
<path d="M8,124 H402"/>
</g>
<g transform="translate(24,24)">
<g filter="url(#wob)" fill="none" stroke="#f9a8d4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="ap">
<path d="M4,24 L14,24 L19,10 L26,36 L31,20 L35,24 L42,24"/>
<circle cx="42" cy="24" r="2.4" fill="#f9a8d4" stroke="none"/>
</g>
</g>
<text class="tchalk" x="86" y="50" font-size="16" font-weight="bold" fill="#f4f1e8">mindpulse</text>
<circle cx="202" cy="44" r="4" fill="#fbbf24" class="ayf"/>
<text class="tdim" x="212" y="49" font-size="12" fill="#d9dde3">Python</text>
<text class="tdim" x="86" y="76" font-size="13" fill="#d9dde3">stress detection</text>
<text class="tdim" x="86" y="94" font-size="13" fill="#d9dde3">from typing + mouse</text>
