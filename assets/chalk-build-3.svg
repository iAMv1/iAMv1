</g>
<text x="348" y="25" font-size="11" text-anchor="middle" fill="#e26d5c" class="aprf">13 &#183; 09 &#183; 26</text>
<text x="384" y="50" font-size="11" text-anchor="end" fill="#e26d5c" class="aprf">no. 3</text>
