# Regenerates the chalkboard widgets daily from live GitHub data.
# Uses only the default GITHUB_TOKEN (never a PAT), so the push below does
# not retrigger this workflow (recursion-safe).
name: Chalkboard widgets

on:
  schedule:
    - cron: '30 0,6,12,18 * * *' # 06:00 / 12:00 / 18:00 / 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chalk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fixture self-check (parses, markers, budgets)
        run: |
          python scripts/generate_chalk.py --stdin --out-dir /tmp/chalk-fx --at "2026-09-14T12:00+05:30" < scripts/fixture.json
          python scripts/selfcheck.py /tmp/chalk-fx


      - name: Generate chalkboard widgets
        run: python scripts/generate_chalk.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push (idempotent, no-op on clean tree)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/chalk-*.svg README.md && git diff --cached --quiet || (git commit -m "[Automated] chalk refresh" && git push)
