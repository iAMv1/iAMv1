name: ARA - Autonomous Repository Agent
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Auto-label unlabeled issues
        run: |
          gh issue list --label "" --json number --jq '.[].number' | while read id; do
            [ -z "$id" ] && continue
            gh issue edit "$id" --add-label "untriaged" --repo $REPO
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Stale check (14d)
        run: |
          gh issue list --state open --json number,updatedAt --jq '.[] | select((now - (.updatedAt | fromdateiso8601)) > 14*86400) | .number' | while read id; do
            [ -z "$id" ] && continue
            gh issue comment "$id" --body "Stale 14d. Will close in 7d." --repo $REPO
            gh issue edit "$id" --add-label "stale" --repo $REPO
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Close stale (21d)
        run: |
          gh issue list --label "stale" --state open --json number,updatedAt --jq '.[] | select((now - (.updatedAt | fromdateiso8601)) > 21*86400) | .number' | while read id; do
            [ -z "$id" ] && continue
            gh issue close "$id" --comment "Auto-closed (21d stale)." --repo $REPO
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Health report
        run: |
          echo "Open: $(gh issue list --state open --json number --jq 'length' --repo $REPO)"
          echo "Unlabeled: $(gh issue list --label '' --json number --jq 'length' --repo $REPO)"
          echo "Stale: $(gh issue list --label stale --state open --json number --jq 'length' --repo $REPO)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}